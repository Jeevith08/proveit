<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="pGreen" x1="60" y1="40" x2="440" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="60%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="100" y1="60" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#22C55E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield (Transparent Center, Neon Border) -->
  <rect x="24" y="24" width="464" height="464" rx="108" stroke="url(#pGreen)" stroke-width="12" stroke-opacity="0.85" filter="url(#neonGlow)"/>

  <!-- Stylized Giant Letter 'P' with Integrated Victory Checkmark -->
  <g filter="url(#neonGlow)">
    <!-- Main P Vertical Stem (Green) -->
    <path d="M 120 110 C 120 98, 130 88, 142 88 L 200 88 C 212 88, 222 98, 222 110 L 222 360 C 222 372, 212 382, 200 382 L 142 382 C 130 382, 120 372, 120 360 Z" fill="url(#pGreen)"/>

    <!-- Dynamic P Loop (Upper Arch, crisp White + Green) -->
    <path d="M 218 88 L 320 88 C 382 88, 416 122, 416 182 C 416 242, 380 276, 318 276 L 218 276 Z" fill="none" stroke="url(#whiteGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sharp Dynamic 'Prove' Checkmark Blade (Cutting into the P Loop) -->
    <path d="M 188 190 L 246 248 L 396 98" fill="none" stroke="url(#pGreen)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Name: PROVE IT -->
  <g text-anchor="middle">
    <text x="256" y="442" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="8">
      <tspan fill="#FFFFFF">PROVE </tspan>
      <tspan fill="#4ADE80">IT</tspan>
    </text>
  </g>
</svg>
