<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Letter P body -->
  <g filter="url(#glow)">
    <!-- Vertical stem -->
    <rect x="18" y="15" width="12" height="70" rx="3" fill="url(#pGrad)"/>
    <!-- Top horizontal bar -->
    <rect x="18" y="15" width="38" height="12" rx="3" fill="url(#pGrad)"/>
    <!-- Middle horizontal bar -->
    <rect x="18" y="43" width="38" height="12" rx="3" fill="url(#pGrad)"/>
    <!-- Right curve top -->
    <rect x="48" y="15" width="12" height="16" rx="3" fill="url(#pGrad)"/>
    <!-- Right curve bottom -->
    <rect x="48" y="39" width="12" height="16" rx="3" fill="url(#pGrad)"/>
  </g>

  <!-- Arrow inside P bowl -->
  <g filter="url(#glow)">
    <line x1="32" y1="48" x2="48" y2="27" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <polyline points="40,24 50,24 50,34" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
